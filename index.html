<!doctype html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>BMI Calculator</title>
  <meta name="description" content="คำนวณดัชนีมวลกาย (BMI) ตามเกณฑ์เอเชียและ WHO พร้อมติดตามน้ำหนัก เป้าหมาย และพลังงานที่ร่างกายต้องการ" />
  <meta name="theme-color" content="#4f46e5" />
  <meta property="og:title" content="BMI Calculator" />
  <meta property="og:description" content="คำนวณ BMI ติดตามน้ำหนัก ตั้งเป้าหมาย และดูพลังงานที่ร่างกายต้องการ" />
  <meta property="og:type" content="website" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="apple-touch-icon.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="BMI" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Prompt:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <canvas id="confetti" class="hidden" aria-hidden="true"></canvas>

  <div class="shell">
    <div class="print-head"><strong>BMI Report</strong><span id="printDate"></span></div>

    <header class="nav no-print">
      <div class="brand">
        <span class="logo" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12h4l3-7 4 14 3-7h4"/></svg>
        </span>
        <div>
          <strong>BMI Calculator</strong>
          <span data-i18n="sub"></span>
        </div>
      </div>
      <div class="nav-actions">
        <div class="seg sm" id="langSeg" role="group" data-i18n-aria="langLabel">
          <button type="button" class="seg-btn" data-lang="th">TH</button>
          <button type="button" class="seg-btn" data-lang="en">EN</button>
        </div>
        <button id="guideBtn" class="ghost-btn wide" type="button">
          <span class="btn-with-ico">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M9.5 9.5a2.5 2.5 0 1 1 3.5 2.3c-.7.4-1 .9-1 1.7M12 17h.01"/></svg>
            <span data-i18n="guideBtn"></span>
          </span>
        </button>
        <button id="installBtn" class="ghost-btn wide" type="button"><span data-i18n="install"></span></button>
        <button id="themeBtn" class="ghost-btn" type="button" data-i18n-aria="theme">
          <svg class="i-moon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
          <svg class="i-sun" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        </button>
      </div>
    </header>

    <section class="toolbar no-print">
      <div class="profile-bar">
        <select id="profileSel" data-i18n-aria="profile"></select>
        <button id="profAdd" class="chip-btn" type="button" data-i18n-title="pAdd" data-i18n-aria="pAdd">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
        </button>
        <button id="profEdit" class="chip-btn" type="button" data-i18n-title="pEdit" data-i18n-aria="pEdit">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20h9M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>
        </button>
        <button id="profDel" class="chip-btn danger" type="button" data-i18n-title="pDel" data-i18n-aria="pDel">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14M10 11v6M14 11v6"/></svg>
        </button>
      </div>
      <div class="toolbar-right">
        <span class="tb-label" data-i18n="std"></span>
        <div class="seg sm" id="stdSeg" role="group">
          <button type="button" class="seg-btn" data-std="asia" data-i18n="stdAsia"></button>
          <button type="button" class="seg-btn" data-std="who" data-i18n="stdWho"></button>
        </div>
        <label class="switch">
          <input type="checkbox" id="soundTg" />
          <span class="knob"></span><b data-i18n="sound"></b>
        </label>
      </div>
    </section>

    <main>
      <div class="grid">
        <!-- INPUT -->
        <section class="panel no-print-inputs">
          <div class="panel-head">
            <h2 data-i18n="inTitle"></h2>
            <button id="reset" class="link-btn no-print" type="button" data-i18n="reset"></button>
          </div>

          <div class="seg" id="unitSeg" role="group">
            <button class="seg-btn" data-unit="metric" type="button">Metric <em>kg · cm</em></button>
            <button class="seg-btn" data-unit="imperial" type="button">Imperial <em>lb · in</em></button>
          </div>

          <form id="form" novalidate>
            <div class="field">
              <label for="height" data-i18n="height"></label>
              <div class="input-wrap">
                <input type="number" id="height" step="0.1" inputmode="decimal" />
                <span class="suffix" id="hUnit">cm</span>
              </div>
              <input type="range" id="heightRange" class="no-print" data-i18n-aria="height" />
              <small class="err" id="hErr"></small>
            </div>

            <div class="field">
              <label for="weight" data-i18n="weight"></label>
              <div class="input-wrap">
                <input type="number" id="weight" step="0.1" inputmode="decimal" />
                <span class="suffix" id="wUnit">kg</span>
              </div>
              <input type="range" id="weightRange" class="no-print" data-i18n-aria="weight" />
              <small class="err" id="wErr"></small>
            </div>

            <details class="more" id="more">
              <summary data-i18n="more"></summary>
              <div class="more-body">
                <div class="row2">
                  <div class="field">
                    <label data-i18n="sex"></label>
                    <div class="seg sm" id="sexSeg" role="group">
                      <button type="button" class="seg-btn" data-sex="m" data-i18n="male"></button>
                      <button type="button" class="seg-btn" data-sex="f" data-i18n="female"></button>
                    </div>
                  </div>
                  <div class="field">
                    <label for="age" data-i18n="age"></label>
                    <div class="input-wrap sm">
                      <input type="number" id="age" step="1" inputmode="numeric" />
                      <span class="suffix" data-i18n="ageU"></span>
                    </div>
                    <small class="err" id="aErr"></small>
                  </div>
                </div>
                <div class="field">
                  <label for="waist" data-i18n="waist"></label>
                  <div class="input-wrap sm">
                    <input type="number" id="waist" step="0.1" inputmode="decimal" />
                    <span class="suffix" id="waUnit">cm</span>
                  </div>
                  <small class="err" id="waErr"></small>
                </div>
                <div class="field">
                  <label for="act" data-i18n="activity"></label>
                  <select id="act"></select>
                </div>
              </div>
            </details>
          </form>

          <div class="actions no-print">
            <button id="saveBtn" class="btn primary" type="button" data-i18n="save"></button>
            <button id="shareBtn" class="btn" type="button" data-i18n="share"></button>
          </div>
          <p class="note no-print" data-i18n="note"></p>
        </section>

        <!-- RESULT -->
        <section class="panel result">
          <div id="empty" class="empty hidden">
            <div class="empty-ico">
              <svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 8v5M12 16h.01"/></svg>
            </div>
            <p data-i18n="empty"></p>
          </div>

          <div id="out">
            <div class="panel-head">
              <h2 data-i18n="outTitle"></h2>
              <span id="badge" class="badge" role="status" aria-live="polite">—</span>
            </div>

            <div class="hero">
              <div class="hero-num"><span id="bmiVal">0.0</span><small>kg/m²</small></div>
              <p id="advice" class="advice"></p>
              <p id="childWarn" class="warn hidden" data-i18n="child"></p>
            </div>

            <div class="scale" role="img" aria-label="BMI scale">
              <div class="bar">
                <div class="segs" id="segs"></div>
                <div id="marker" class="marker"><span id="markerTip">0.0</span></div>
              </div>
              <div class="ticks" id="ticks"></div>
            </div>

            <div class="stats">
              <div class="stat">
                <span class="stat-label" data-i18n="ideal"></span>
                <strong id="ideal">—</strong>
              </div>
              <div class="stat">
                <span class="stat-label" id="deltaLabel">—</span>
                <strong id="delta">—</strong>
              </div>
            </div>

            <ul class="legend" id="legend"></ul>
          </div>
        </section>
      </div>

      <div class="grid cards">
        <!-- ENERGY -->
        <section class="panel">
          <div class="panel-head"><h2 data-i18n="eTitle"></h2></div>
          <div id="energyBody"></div>
        </section>

        <!-- WAIST -->
        <section class="panel">
          <div class="panel-head"><h2 data-i18n="wTitle"></h2></div>
          <div id="waistBody"></div>
        </section>

        <!-- GOAL -->
        <section class="panel full no-print-goal">
          <div class="panel-head"><h2 data-i18n="gTitle"></h2></div>
          <div class="goal-form no-print">
            <div class="field">
              <label for="gTarget" data-i18n="gTarget"></label>
              <div class="input-wrap sm">
                <input type="number" id="gTarget" step="0.1" inputmode="decimal" />
                <span class="suffix" id="gUnit">kg</span>
              </div>
            </div>
            <div class="field">
              <label for="gRate" data-i18n="gRate"></label>
              <select id="gRate"></select>
            </div>
            <div class="goal-btns">
              <button id="gSet" class="btn primary" type="button" data-i18n="gSet"></button>
              <button id="gClear" class="btn" type="button" data-i18n="gClear"></button>
            </div>
          </div>
          <div id="goalBody"></div>
        </section>

        <!-- HISTORY -->
        <section class="panel full">
          <div class="panel-head">
            <h2 data-i18n="hTitle"></h2>
            <div class="seg sm no-print" id="chartSeg" role="group">
              <button type="button" class="seg-btn" data-chart="bmi" data-i18n="chBmi"></button>
              <button type="button" class="seg-btn" data-chart="weight" data-i18n="chW"></button>
            </div>
          </div>
          <div id="chart" class="chart"></div>
          <div id="chartReadout" class="readout"></div>
          <div id="histList" class="hist"></div>
          <div class="hist-actions no-print">
            <button id="csvBtn" class="btn sm" type="button" data-i18n="csv"></button>
            <button id="pdfBtn" class="btn sm" type="button" data-i18n="pdf"></button>
            <button id="backupBtn" class="btn sm" type="button" data-i18n="backup"></button>
            <button id="restoreBtn" class="btn sm" type="button" data-i18n="restore"></button>
            <button id="clearBtn" class="btn sm danger" type="button" data-i18n="clearAll"></button>
            <input type="file" id="restoreFile" accept="application/json,.json" class="hidden" />
          </div>
        </section>
      </div>
    </main>

    <footer class="foot" data-i18n="foot"></footer>
  </div>

  <dialog id="profDialog">
    <form method="dialog" id="profForm">
      <label for="profName" data-i18n="pName"></label>
      <input type="text" id="profName" maxlength="40" autocomplete="off" />
      <div class="dlg-btns">
        <button type="button" id="profCancel" class="btn" data-i18n="cancel"></button>
        <button value="ok" class="btn primary" data-i18n="ok"></button>
      </div>
    </form>
  </dialog>

  <dialog id="guideDlg" class="guide" aria-labelledby="guideTitle">
    <div class="guide-head">
      <div>
        <h2 id="guideTitle" data-i18n="guideTitle"></h2>
        <p class="muted" data-i18n="guideSub"></p>
      </div>
      <button id="guideX" class="chip-btn" type="button" data-i18n-aria="guideX" data-i18n-title="guideX">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>
      </button>
    </div>
    <ol id="guideBody" class="guide-steps"></ol>
    <p class="guide-note" data-i18n="guideNote"></p>
    <div class="guide-foot">
      <span class="muted" data-i18n="guideFoot"></span>
      <button id="guideOk" class="btn primary" type="button" data-i18n="guideClose"></button>
    </div>
  </dialog>

  <dialog id="confirmDlg">
    <form method="dialog">
      <p id="confirmMsg" class="confirm-msg"></p>
      <div class="dlg-btns">
        <button type="button" id="confirmNo" class="btn" data-i18n="cancel"></button>
        <button value="ok" class="btn primary" data-i18n="ok" autofocus></button>
      </div>
    </form>
  </dialog>

  <div id="toast" class="toast" role="status"></div>
  <noscript><p style="text-align:center;padding:24px;font-family:sans-serif">กรุณาเปิดใช้งาน JavaScript / Please enable JavaScript</p></noscript>

  <script src="js/i18n.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
